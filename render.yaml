services:
  - type: web
    name: golf-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: golf-db
          property: connectionString

databases:
  - name: golf-db
    plan: free
    ipAllowList: []
