services:
  - type: web
    name: golf-tournament
    env: python
    buildCommand: |
      # 安裝 Python 依賴
      pip install -r requirements.txt
      
      # 創建靜態文件夾
      mkdir -p static
      
      # 複製前端文件到靜態文件夾
      cp -r frontend/build/* static/ || true
      
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.8.18
