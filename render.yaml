services:
  - type: web
    name: gold
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: golf-db
          property: connectionString
      - key: SQLALCHEMY_TRACK_MODIFICATIONS
        value: "false"
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: golf-db
    plan: free
    ipAllowList: []
